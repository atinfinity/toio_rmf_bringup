<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 808 630" width="808" height="630" role="img" aria-labelledby="t d">
  <title id="t">A3マットのnavグラフ</title>
  <desc id="d">0.42 x 0.30 m のA3マット上に配置された6頂点(charger_1, patrol_A, patrol_B, patrol_C, patrol_D, charger_2)と8本の双方向レーン。</desc>
  <style>
    .bg   { fill: #ffffff; }
    .mat  { fill: #eef2f7; stroke: #b6c2d1; stroke-width: 2; }
    .lane { stroke: #8c9bab; stroke-width: 5; stroke-linecap: round; fill: none; }
    .wp   { fill: #ffffff; stroke: #2f6fdb; stroke-width: 4; }
    .chg  { fill: #fff4d6; stroke: #d9971a; stroke-width: 4; }
    .lbl  { fill: #1f2328; font-size: 20px; font-weight: 600; }
    .mut  { fill: #57606a; font-size: 17px; }
    .tiny { fill: #57606a; font-size: 15px; }
    .bolt { fill: #d9971a; font-size: 18px; font-weight: 700; }
    .bar  { stroke: #57606a; stroke-width: 2.5; }
    text  { font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #0d1117; }
      .mat  { fill: #161b22; stroke: #30363d; }
      .lane { stroke: #6e7681; }
      .wp   { fill: #0d1117; stroke: #58a6ff; }
      .chg  { fill: #3d2f0e; stroke: #d29922; }
      .lbl  { fill: #e6edf3; }
      .mut, .tiny { fill: #8b949e; }
      .bolt { fill: #d29922; }
      .bar  { stroke: #8b949e; }
    }
  </style>

  <rect class="bg" width="808" height="630"/>

  <text class="lbl" x="110" y="40">A3マット nav グラフ</text>
  <text class="mut" x="110" y="66">0.42 × 0.30 m / 全レーン双方向 / 縮尺 0.005 m per px</text>

  <!-- mat: building.yaml pixel (0,0)-(84,60) mapped at 7 svg px per map px, offset (110,80) -->
  <rect class="mat" x="110" y="80" width="588" height="420" rx="8"/>

  <!-- lanes (all bidirectional) -->
  <g class="lane">
    <line x1="194" y1="290" x2="334" y2="178"/><!-- charger_1 - patrol_A -->
    <line x1="194" y1="290" x2="334" y2="402"/><!-- charger_1 - patrol_C -->
    <line x1="334" y1="178" x2="544" y2="178"/><!-- patrol_A - patrol_B -->
    <line x1="334" y1="402" x2="544" y2="402"/><!-- patrol_C - patrol_D -->
    <line x1="544" y1="178" x2="628" y2="290"/><!-- patrol_B - charger_2 -->
    <line x1="544" y1="402" x2="628" y2="290"/><!-- patrol_D - charger_2 -->
    <line x1="334" y1="178" x2="334" y2="402"/><!-- patrol_A - patrol_C -->
    <line x1="544" y1="178" x2="544" y2="402"/><!-- patrol_B - patrol_D -->
  </g>

  <!-- measurement annotation -->
  <text class="tiny" x="439" y="164" text-anchor="middle">0.15 m</text>

  <!-- chargers -->
  <rect class="chg" x="179" y="275" width="30" height="30" rx="5"/>
  <text class="bolt" x="194" y="297" text-anchor="middle">⚡</text>
  <text class="lbl" x="166" y="287" text-anchor="end">charger_1</text>
  <text class="tiny" x="166" y="308" text-anchor="end">toio1 の充電位置</text>

  <rect class="chg" x="613" y="275" width="30" height="30" rx="5"/>
  <text class="bolt" x="628" y="297" text-anchor="middle">⚡</text>
  <text class="lbl" x="656" y="287">charger_2</text>
  <text class="tiny" x="656" y="308">toio2 の充電位置</text>

  <!-- patrol waypoints -->
  <circle class="wp" cx="334" cy="178" r="15"/>
  <text class="lbl" x="334" y="150" text-anchor="middle">patrol_A</text>

  <circle class="wp" cx="544" cy="178" r="15"/>
  <text class="lbl" x="544" y="150" text-anchor="middle">patrol_B</text>

  <circle class="wp" cx="334" cy="402" r="15"/>
  <text class="lbl" x="334" y="437" text-anchor="middle">patrol_C</text>

  <circle class="wp" cx="544" cy="402" r="15"/>
  <text class="lbl" x="544" y="437" text-anchor="middle">patrol_D</text>

  <!-- legend -->
  <circle class="wp" cx="122" cy="547" r="12"/>
  <text class="mut" x="142" y="553">巡回 waypoint</text>

  <rect class="chg" x="273" y="535" width="24" height="24" rx="4"/>
  <text class="mut" x="307" y="553">充電 waypoint(is_charger)</text>

  <line class="lane" x1="560" y1="547" x2="600" y2="547"/>
  <text class="mut" x="612" y="553">双方向レーン</text>

  <!-- scale bar: 0.1 m = 20 map px = 140 svg px -->
  <g class="bar">
    <line x1="558" y1="608" x2="698" y2="608"/>
    <line x1="558" y1="601" x2="558" y2="615"/>
    <line x1="698" y1="601" x2="698" y2="615"/>
  </g>
  <text class="tiny" x="628" y="596" text-anchor="middle">0.1 m</text>
</svg>
