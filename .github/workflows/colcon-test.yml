name: colcon-test

on: push

jobs:
  colcon-test:
    runs-on: ubuntu-latest
    container: ros:jazzy-ros-base
    steps:
      - name: Checkout toio_rmf_bringup
        uses: actions/checkout@v7
        with:
          path: src/toio_rmf_bringup

      # toio_rmf_maps and toio_fleet_adapter are exec dependencies that are
      # not released to rosdep, so they are built from source here, along
      # with toio_msgs which toio_fleet_adapter imports. Having the real
      # packages in the workspace lets rosdep resolve every key instead of
      # skipping them (atinfinity/toio_rmf_bringup#16).
      - name: Checkout toio_rmf_maps
        uses: actions/checkout@v7
        with:
          repository: atinfinity/toio_rmf_maps
          path: src/toio_rmf_maps

      - name: Checkout toio_fleet_adapter
        uses: actions/checkout@v7
        with:
          repository: atinfinity/toio_fleet_adapter
          path: src/toio_fleet_adapter

      - name: Checkout toio_msgs
        uses: actions/checkout@v7
        with:
          repository: atinfinity/toio_msgs
          path: src/toio_msgs

      - name: Install dependencies
        shell: bash
        run: |
          apt-get update
          rosdep update
          rosdep install --from-paths src --ignore-src -y \
            --skip-keys "toio_gazebo toio_navigation"

      - name: Build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-up-to toio_rmf_bringup

      - name: Test
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --packages-select toio_rmf_bringup --event-handlers console_cohesion+
          colcon test-result --verbose
